[project]
name = "linkedin-profile-api"
version = "1.0.0"
description = "Structured JSON for a LinkedIn profile URL, via direct HTTP against LinkedIn's Server-Driven UI endpoints. No browser automation."
requires-python = ">=3.11"

dependencies = [
    # Critical, not interchangeable. Plain requests/httpx present a JA3 TLS
    # fingerprint no browser produces and are answered with HTTP 999 regardless
    # of a valid session cookie. See METHODOLOGY.md.
    "curl_cffi>=0.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# CI runs with no credentials and no network (AGENTS.md §8).
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
